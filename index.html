
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ingresar código</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container" id="container">

    <h1>INTRODUCI EL CODIGO</h1>

    <form id="codeForm">

      <input
        type="text"
        id="codigo"
        placeholder="Código"
        autocomplete="off"
        required
      >

      <button type="submit">
        Continuar
      </button>

    </form>

    <p id="error"></p>

  </main>

  <script src="script.js"></script>

</body>
</html>
